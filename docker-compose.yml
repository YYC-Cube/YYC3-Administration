services:
  app:
    # 批次三(2026-11-02):容器线切换为 GHCR 镜像拉起——docker-release.yml 按
    # vX.Y.Z tag 发布镜像(版本 tag + latest),回滚 = 改镜像 tag 后 up -d(runbook §4.3)。
    # 本地开发或紧急自构建:注释 image 段、启用 build 段。
    image: ghcr.io/yyc-cube/yyc3-administration:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── 自托管后端(P5/P6,M1 数据面) ─────────────────────────────────
  # 启动:docker compose --profile server up -d(需同目录 .env 含
  # DATABASE_URL/JWT_SECRET;DATABASE_URL 指向 db 服务时用主机名 db)
  # 🔒 前端经反向代理把 /api 转发到本服务(端口 8787),勿直接暴露公网明文 HTTP
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    profiles: ["server"]
    ports:
      - "8787:8787"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8787
      # compose 网络内连 db 服务(覆盖 .env 中宿主开发用连接串)
      - DATABASE_URL=postgres://yyc3_app:yyc3pg@db:5432/yyc3_admin
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 项目专用 PostgreSQL(ADR-0003;本机已有主库时可用外部 DATABASE_URL 替代
  # 并移除本服务与 depends_on)
  db:
    image: postgres:15-alpine
    profiles: ["server"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: yyc3_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: yyc3_admin
    volumes:
      - yyc3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yyc3_app -d yyc3_admin"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  yyc3_pgdata:
