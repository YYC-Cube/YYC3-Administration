# =============================================================================
# YYC³ FAmily-AI Agent 全Agent Docker Compose v3.0
# 适配 DGX Spark N2 (yyc3-102) 实际环境
#
# 8个Agent服务端口规划 (遵循5位结构 25XXY):
#   元启·天枢 25600  言启·千行 25601  语枢·万物 25602
#   预见·先知 25603  知遇·伯乐 25604  智云·守护 25605
#   格物·宗师 25606  创想·灵韵 25607
#
# 推理后端: 本地 vLLM (Qwen3.6-27B-FP8, Port 8000)
# 安全沙箱: OpenShell Gateway (Port 8080)
# =============================================================================
# 版本: v3.0.0 | 日期: 2026-07-28 | 五高架构对齐
# =============================================================================

version: "3.8"

networks:
  yyc3-agent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

  # ==========================================================================
  # 治理中枢 (Governance Hub) — 行为审计/预算管理/协同规则/ACS策略 | 25700
  # P0-1: 行为审计 + Kill Switch
  # P0-2: Token 预算 + 成本追踪
  # P0-3: 协同触发规则
  # P1-1: ACS 治理标准映射
  # P1-2: 上下文图谱基础
  # ==========================================================================
  governance-hub:
    image: python:3.12-slim
    container_name: yyc3-governance-hub
    hostname: governance-hub
    ports:
      - "25700:25700"
    volumes:
      - yyc3-shared-data:/data
      - ./governance_hub.py:/workspace/governance_hub.py:ro
    environment:
      - GOVERNANCE_DB=/data/governance.db
      - GOVERNANCE_PORT=25700
      - LOG_LEVEL=INFO
      - TZ=Asia/Shanghai
      - LANG=zh_CN.UTF-8
    working_dir: /workspace
    command: >-
      sh -c "pip install --quiet flask requests &&
             python governance_hub.py"
    networks:
      - yyc3-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:25700/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

volumes:
  yyc3-shared-prompts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/yyc3/.nemoclaw/agent-prompts/v3
  yyc3-shared-data:
    driver: local

services:
  # ==========================================================================
  # 元启·天枢 (总指挥) — 全局编排与战略决策 | 端口 25600
  # ==========================================================================
  yuanqi-tianshu:
    image: python:3.12-slim
    container_name: agent-yuanqi-tianshu
    hostname: yuanqi-tianshu
    ports:
      - "25600:6000"
    volumes:
      - yyc3-shared-prompts:/prompts:ro
      - yyc3-shared-data:/data
      - ./agents/yuanqi-tianshu:/workspace
    environment: &agent-env-base
      - AGENT_NAME=yuanqi_tianshu
      - AGENT_ROLE=coordinator
      - AGENT_LABEL=元启天枢
      - AGENT_PHONE=0379-0206
      - PORT=6000
      - LOG_LEVEL=INFO
      - VLLM_ENDPOINT=http://host.docker.internal:8000/v1
      - VLLM_MODEL=Qwen/Qwen3.6-27B-FP8
      - SYSTEM_PROMPT_PATH=/prompts/main-system.md
      - OPENCLAW_GATEWAY=http://host.docker.internal:18789
      - GOVERNANCE_ENDPOINT=http://governance-hub:25700
      - TZ=Asia/Shanghai
      - LANG=zh_CN.UTF-8
    working_dir: /workspace
    command: >-
      sh -c "pip install --quiet flask requests openai &&
             cp /prompts/main-system.md /workspace/SYSTEM.md &&
             python agent_server.py --port 6000 --role tianshu"
    networks:
      - yyc3-agent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:6000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  # ==========================================================================
  # 言启·千行 (导航员) — 意图识别与任务路由 | 端口 25601
