# =============================================================================
# YYC³ Administration — GitHub Pages Deploy
# =============================================================================
# 仅在 CI 工作流(类型/lint/测试/覆盖率/构建/E2E/安全门)成功后部署 main。
# 此前 push main 直接触发部署,与 CI 并行——未经质量门验证的提交
# 可能被发布到生产(2026-09-26 CI 闭环修复)。保留 workflow_dispatch
# 供紧急手动部署。
# Requires: Pages → Source "GitHub Actions" in repo settings.
# Domain: https://admin.yyc3.vip (CNAME → yyc-cube.github.io)
# =============================================================================

name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # 手动触发放行;workflow_run 触发时要求 CI 结论为 success 且源分支为 main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (CI-verified commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run 事件检出 CI 实际验证的提交(而非默认分支最新)
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify CNAME in dist
        run: test -f dist/CNAME && cat dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
