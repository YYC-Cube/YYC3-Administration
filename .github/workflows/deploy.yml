# =============================================================================
# YYC³ Administration — GitHub Pages Deploy
# =============================================================================
# 仅在 CI 工作流(类型/lint/测试/覆盖率/构建/E2E/安全门)成功后部署 main。
# 此前 push main 直接触发部署,与 CI 并行——未经质量门验证的提交
# 可能被发布到生产(2026-09-26 CI 闭环修复)。保留 workflow_dispatch
# 供紧急手动部署。
# Requires: Pages → Source "GitHub Actions" in repo settings.
# Domain: https://admin.yyc3.vip (CNAME → yyc-cube.github.io)
# =============================================================================

name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # 手动触发放行;workflow_run 触发时要求 CI 结论为 success 且源分支为 main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (CI-verified commit)
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          # workflow_run 事件检出 CI 实际验证的提交(而非默认分支最新)
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Verify CNAME in dist
        run: test -f dist/CNAME && cat dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
