name: CI

# 最小权限原则：覆盖组织/仓库级 GITHUB_TOKEN 默认权限，
# 防止 PR 触发的 workflow 意外获得写权限。
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==========================================
  # Job 1: 代码质量（类型检查 + Lint + 单元测试 + 覆盖率）
  # ==========================================
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      # SHA 固定防供应链投毒；注释标注语义化版本便于升级
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # ── 供应链门:生产依赖出现高危及以上漏洞即阻断(F-06/漏洞闭环) ──
      - name: Supply-chain audit (prod deps)
        run: pnpm audit --prod --audit-level high

      # ── 死代码门:未引用文件/未用依赖必须为 0(F-06 防回流) ──
      # 注:unimported 退出码含 1 条 monaco `?worker` unresolved 误报
      # (Vite 构建期语法,实测有效),故以计数判定而非退出码;
      # tw-animate-css 仅经 CSS @import 消费,已在 .unimportedrc.json 声明忽略
      - name: Dead code & unused dependency gate (unimported)
        run: |
          npx unimported > unimported-report.txt || true
          cat unimported-report.txt
          UNUSED=$(awk '/^ *unused dependencies/{print $NF}' unimported-report.txt)
          FILES=$(awk '/^ *unimported files/{print $NF}' unimported-report.txt)
          echo "unused dependencies: ${UNUSED:-?} | unimported files: ${FILES:-?}"
          if [ "$UNUSED" != "0" ] || [ "$FILES" != "0" ]; then
            echo "::error::Dead code detected — remove unreferenced files/dependencies (see report above)"
            exit 1
          fi

      # ── 循环依赖门:madge 检出循环即阻断 ──
      - name: Circular dependency gate (madge)
        run: npx madge --circular --extensions ts,tsx src/

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Build
        run: pnpm build

  # ==========================================
  # Job 2: E2E 测试（Playwright，仅 Node 22 / chromium）
  # ==========================================
  # 注意：不在 push 事件上限制——PR 也必须跑 E2E。
  # 此前 `if: github.event_name == 'push'` 导致 PR 永远看不到 E2E 结果，
  # main 分支连续红盘 22+ 天无人察觉（见审计报告 2.3 节）。
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30 # 防 webServer/teardown 挂死空耗 runner

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
