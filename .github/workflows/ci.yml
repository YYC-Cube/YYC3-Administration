name: CI

# 最小权限原则：覆盖组织/仓库级 GITHUB_TOKEN 默认权限，
# 防止 PR 触发的 workflow 意外获得写权限。
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==========================================
  # Job 1: 代码质量（类型检查 + Lint + 单元测试 + 覆盖率）
  # ==========================================
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      # SHA 固定防供应链投毒；注释标注语义化版本便于升级
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # ── 供应链门:生产依赖出现高危及以上漏洞即阻断(F-06/漏洞闭环) ──
      - name: Supply-chain audit (prod deps)
        run: pnpm audit --prod --audit-level high

      # ── 死代码门:未引用文件/未用依赖必须为 0(F-06 防回流) ──
      # 注:unimported 退出码含 1 条 monaco `?worker` unresolved 误报
      # (Vite 构建期语法,实测有效),故以计数判定而非退出码;
      # tw-animate-css 仅经 CSS @import 消费,已在 .unimportedrc.json 声明忽略
      - name: Dead code & unused dependency gate (unimported)
        run: |
          npx unimported > unimported-report.txt || true
          cat unimported-report.txt
          UNUSED=$(awk '/^ *unused dependencies/{print $NF}' unimported-report.txt)
          FILES=$(awk '/^ *unimported files/{print $NF}' unimported-report.txt)
          echo "unused dependencies: ${UNUSED:-?} | unimported files: ${FILES:-?}"
          if [ "$UNUSED" != "0" ] || [ "$FILES" != "0" ]; then
            echo "::error::Dead code detected — remove unreferenced files/dependencies (see report above)"
            exit 1
          fi

      # ── 循环依赖门:madge 检出循环即阻断 ──
      - name: Circular dependency gate (madge)
        run: npx madge --circular --extensions ts,tsx src/

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: matrix.node-version == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Build
        run: pnpm build

  # ==========================================
  # Job 2: E2E 测试（Playwright，仅 Node 22 / chromium）
  # ==========================================
  # 注意：不在 push 事件上限制——PR 也必须跑 E2E。
  # 此前 `if: github.event_name == 'push'` 导致 PR 永远看不到 E2E 结果，
  # main 分支连续红盘 22+ 天无人察觉（见审计报告 2.3 节）。
  e2e:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
