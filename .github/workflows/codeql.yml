# CodeQL — 基础静态安全扫描（JavaScript/TypeScript）
name: CodeQL

permissions:
  # CodeQL 需要写回 SARIF 上传；security-events 仅此 workflow 授予
  security-events: write
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # 每周一 04:00

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠ 三步(init/autobuild/analyze)必须同版本:init 写入配置时记录自身版本,
      #   其余步读到不一致版本即崩(2026-11-02 #45 实证:"Loaded config for
      #   4.38.2 but running 4.39.1");dependabot.yml 已将 actions 生态成组防复发
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          # ⚠ v3.38 起 config 输入仅接受内联 YAML(路径字符串会被当配置内容写盘)
          # docs/**(历史粘贴归档)与测试产物不参与安全分析——示例密钥/URL 会产生
          # 不可行动误报(2026-09-26 漏洞闭环)
          config: |
            paths-ignore:
              - docs/**
              - tests/**
              - '**/*.test.*'
              - '**/*.spec.*'
              - playwright-report/**
              - coverage/**
              - dist/**

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
