# CodeQL — 基础静态安全扫描（JavaScript/TypeScript）
name: CodeQL

permissions:
  # CodeQL 需要写回 SARIF 上传；security-events 仅此 workflow 授予
  security-events: write
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # 每周一 04:00

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@eaec7bdd3f18a9ef62b9f0d85d410932cf58c886 # v3.38.2
        with:
          languages: javascript-typescript
          config: .github/codeql/config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@eaec7bdd3f18a9ef62b9f0d85d410932cf58c886 # v3.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@eaec7bdd3f18a9ef62b9f0d85d410932cf58c886 # v3.38.2
        with:
          category: '/language:javascript-typescript'
