# CodeQL — 基础静态安全扫描（JavaScript/TypeScript）
name: CodeQL

permissions:
  # CodeQL 需要写回 SARIF 上传；security-events 仅此 workflow 授予
  security-events: write
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # 每周一 04:00

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          # ⚠ v3.38 起 config 输入仅接受内联 YAML(路径字符串会被当配置内容写盘)
          # docs/**(历史粘贴归档)与测试产物不参与安全分析——示例密钥/URL 会产生
          # 不可行动误报(2026-09-26 漏洞闭环)
          config: |
            paths-ignore:
              - docs/**
              - tests/**
              - '**/*.test.*'
              - '**/*.spec.*'
              - playwright-report/**
              - coverage/**
              - dist/**

      - name: Autobuild
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: "/language:javascript-typescript"
