# Dependabot — 依赖与 GitHub Actions 定期升级 PR
# npm 周更（生产+开发依赖分组），actions 周查（防止过期 action 引用）
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    groups:
      # 同一 workflow 内多步 action 必须同版本(init 写配置/其余步读配置),
      # 拆单步 PR 会造成版本互锁(2026-11-02 codeql-action 三步实证),
      # 故全部 actions 更新并为单一 PR
      actions-all:
        patterns:
          - '*'
